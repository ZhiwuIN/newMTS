name: Deploy cwpc-h5 to Cloudflare Pages

on:
  push:
    branches:
      - main  # 只有推送到 main 分支时触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Check API crypto
        run: node scripts/check-api-crypto.cjs

      - name: Build H5
        env:
          VITE_REQUEST_PUBLIC_KEY: ${{ secrets.VITE_REQUEST_PUBLIC_KEY }}
          VITE_RESPONSE_PRIVATE_KEY: ${{ secrets.VITE_RESPONSE_PRIVATE_KEY }}
        run: |
          if [ -z "$VITE_REQUEST_PUBLIC_KEY" ] || [ -z "$VITE_RESPONSE_PRIVATE_KEY" ]; then
            echo "::error::Configure VITE_REQUEST_PUBLIC_KEY and VITE_RESPONSE_PRIVATE_KEY repository secrets before deployment."
            exit 1
          fi
          bun run build:h5

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/build/h5 --project-name=h5-cwpc --branch=main
